name: First Ford checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Play the lesson and a complete duel in mobile landscape
        env:
          SCREENSHOT_DIR: screenshots
        run: |
          python -m http.server 8312 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused -fsS http://127.0.0.1:8312/ -o /dev/null
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-ford-landscape
          path: screenshots/
